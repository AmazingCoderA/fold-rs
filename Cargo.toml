[package]
name = "fold"
version = "0.1.0"
edition = "2021"
description = "Rust reimplementation of the 2007 'Fold' seismic structural-map program"
repository = "https://github.com/AmazingCoderA/fold-rs"

[lib]
name = "fold"
path = "src/lib.rs"

[[bin]]
name = "fold"
path = "src/main.rs"

[[bin]]
name = "fold-gui"
path = "src/bin/fold_gui.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.29"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
