name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            exe: .exe
          - os: ubuntu-latest
            name: linux-x64
            exe: ""
          - os: macos-latest
            name: macos-arm64
            exe: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxi-dev libgl1-mesa-dev libudev-dev libxkbcommon-dev libwayland-dev
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --release --locked
      - name: Build
        run: cargo build --release --locked --bins
      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/fold${{ matrix.exe }} dist/
          cp target/release/fold-gui${{ matrix.exe }} dist/
          cp README.md dist/
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: fold-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
