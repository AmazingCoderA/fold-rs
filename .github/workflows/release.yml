name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            exe: .exe
          - os: ubuntu-latest
            name: linux-x64
            exe: ""
          - os: macos-latest
            name: macos-arm64
            exe: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxi-dev libgl1-mesa-dev libudev-dev libxkbcommon-dev libwayland-dev
      - name: Build
        run: cargo build --release --locked --bins
      - name: Package
        shell: bash
        run: |
          mkdir -p out
          cp target/release/fold${{ matrix.exe }} out/
          cp target/release/fold-gui${{ matrix.exe }} out/
          cp README.md out/
          tar -czf fold-${{ matrix.name }}.tar.gz -C out .
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: fold-${{ matrix.name }}.tar.gz
          generate_release_notes: true
