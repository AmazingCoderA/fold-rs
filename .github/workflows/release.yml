name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    # macOS-arm64 runner иногда недоступен — не блокируем публикацию Windows,
    # Linux и Android из-за очереди чужих раннеров.
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            exe: .exe
          - os: ubuntu-latest
            name: linux-x64
            exe: ""
          - os: macos-latest
            name: macos-arm64
            exe: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxi-dev libgl1-mesa-dev libudev-dev libxkbcommon-dev libwayland-dev
      - name: Build
        run: cargo build --release --locked --bins
      - name: Package
        shell: bash
        run: |
          mkdir -p out
          cp target/release/fold${{ matrix.exe }} out/
          cp target/release/fold-gui${{ matrix.exe }} out/
          cp README.md out/
          tar -czf fold-${{ matrix.name }}.tar.gz -C out .
      - name: Package Windows ZIP
        if: matrix.name == 'windows-x64'
        shell: pwsh
        run: Compress-Archive -Path out\* -DestinationPath fold-windows-x64.zip
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: fold-${{ matrix.name }}
          path: fold-${{ matrix.name }}.tar.gz
          if-no-files-found: error
      - name: Upload Windows ZIP
        if: matrix.name == 'windows-x64'
        uses: actions/upload-artifact@v4
        with:
          name: fold-windows-x64-zip
          path: fold-windows-x64.zip
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 26.3.11579264
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        shell: bash
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;$NDK_VERSION"
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build native libraries
        shell: bash
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          cargo ndk --manifest-path android-rs/Cargo.toml \
            -t arm64-v8a -t armeabi-v7a -t x86_64 \
            -o android/app/src/main/jniLibs build --release
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble APK
        run: gradle -p android assembleDebug --no-daemon
      - name: Rename APK
        shell: bash
        run: cp android/app/build/outputs/apk/debug/*.apk fold-android-universal.apk
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: fold-android-apk
          path: fold-android-universal.apk
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p assets
          find dist -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.apk' \) -exec cp {} assets/ \;
          cp packaging/aur/PKGBUILD assets/fold-rs-PKGBUILD
          cp packaging/aur/.SRCINFO assets/fold-rs-SRCINFO
          cp packaging/aur/README.md assets/fold-rs-AUR-README.md
          cd assets
          sha256sum * > SHA256SUMS.txt
          ls -lh
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          overwrite_files: true
          generate_release_notes: true
          body: |
            **Fold — Rust-порт программы 2007 года.**

            GUI восстановлен по бинарному DFM-ресурсу оригинала (координаты 1016×694, один масштаб на обе оси при ресайзе), таблица профилей редактируется, ядро считает структурную карту за миллисекунды, Android-порт работает через Rust JNI + Kotlin UI.

            ### Что уточнено по реверсу в этом выпуске
            - значения полей строго из DFM: V ср=1500, f=95, Качество=3;
            - карта строится во внутренней сетке оригинала `N=trunc(q·100)+1`, `ny=N·400/800` (301×150 по умолчанию) с жёсткими границами 21 полосы;
            - 21-полосная палитра «Классика» теперь точная по формуле `0x46641C`;
            - растеризация карты дословно повторяет `Canvas.FillRect`: буфер Image1 800×400, прямоугольники `10/quality` px, обход i(X)→j(Y), поздние заливают ранние; линии сетки `clGray`, 1 px;
            - вертикальный масштаб разреза и время пиков считаются по `0x466980` (`t=2H/V−shift`, сдвиг 0.004/0.04 по наклону) — Edit2 реально влияет на разрез;
            - `StringGrid1`: money-green в первом **столбце** (`FixedCols=1`, `FixedRows=0`), шрифт ячеек Arial Bold 13;
            - Label9 подчёркнут, как в DFM (`fsUnderline`);
            - V/угол/качество ограничены диапазонами original `0x4674AC`/`0x467540`, в том числе при импорте готовой строки.

            ### Дополнительно по реверсу 0x465D68 / 0x466980 / DFM
            - число трасс разреза берётся из длины профиля (`trunc(len/200)+1`, до 100), а не фиксируется на десяти;
            - время разреза расширяется original-поправками `min-=0.02`, `max+=0.084` (знаки по `fsubr`/`fadd` в `0x67399`/`0x673AB`);
            - Image2 теперь рисует полный буфер `0x465BD4`: 300 отсчётов на трассу, импульс шириной 0.05 с, RMS только по первой трассе, `amp=trunc(0.12/rms·sample·x_step)`, отрицательные лепестки соединяются `LineTo`. Буфер 800×201 кэшируется в текстуру `NEAREST` — один квад вместо тысяч линий;
            - пики в Memo1 нумеруются как `t01`, `t02`, … (1-based, с нулевым паддингом);
            - клик по Image2 ставит пик на mouse-down: время растёт сверху вниз по `0x468780` (`t=t_min+Y/H·(t_max−t_min)`), маркер — красная черточка 12×4 из DIB `HACHA` (`X−6..X+6`, `Y−2..Y+2`), а не красная точка;
            - `StringGrid1` теперь как в original: зелёный столбец с подписями `Х1/Y1/Х2/Y2` (`Х` — кириллическая), белый столбец редактируется, X/Y ограничены `0..8000`/`0..4000` (`0x467F66`, `0x467600`);
            - Image2 очищается чистым белым, как `0x46783C`, сетка и трассы строятся по original-шагам;
            - преобразование карта↔Image1 теперь точное: `(W−1)/(H−1)` и вертикальный flip из `0x466198`/`0x4661F0` — линия профиля больше не «отражается» относительно текстуры;
            - `clMoneyGreen` исправлен на `$C0DCC0`, кэпшены меню и hotkeys F2/F3/F4/Del/Alt+Del — строго из DFM;
            - убраны просадки: trig на сетке считается один раз, 21 цвет палитры кэшируется, текст/шрифты/пики не копируются каждый кадр;
            - исправлено «прыгание» фокуса и однокадровое отставание разреза при смене профиля.

            ### Ассеты
            - `fold-windows-x64.zip` — CLI + GUI для Windows (удобно распаковывать в Проводнике)
            - `fold-windows-x64.tar.gz` — тот же набор в tar.gz
            - `fold-linux-x64.tar.gz` — CLI + GUI для Linux
            - `fold-macos-arm64.tar.gz` — CLI + GUI для macOS
            - `fold-android-universal.apk` — APK для arm64-v8a / armeabi-v7a / x86_64
            - `fold-rs-PKGBUILD`, `fold-rs-SRCINFO`, `fold-rs-AUR-README.md` — файлы для AUR (`fold-rs-git`)
            - `SHA256SUMS.txt` — контрольные суммы

            Забытый эксперимент 2007 года. Лицензий и обещаний нет.
          files: |
            assets/*
